name: Remove merged branches (one-time housekeeping)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-merged-branches.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: ${{ github.repository == 'fraware/forward-science' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify merged PRs, then remove only their exact old branch tips
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expected = [{"branch":"experiment/full-six-narration-drafts","pr":10,"sha":"767ae9a23e0ca9697d2a228f417f7c64959adfd8"},{"branch":"experiment/kokoro-candidate-voice","pr":9,"sha":"883dd6535b3782318edaf3d027375947ea90aa5c"},{"branch":"feature/browser-voice-listening","pr":4,"sha":"cdf570f504fd5c9149383725c476c3c046a36005"},{"branch":"feature/downloadable-editions","pr":2,"sha":"00427abcb37440056bb50e1638099509f89d5962"},{"branch":"feature/reader-experience","pr":1,"sha":"48adde0dbf6659a08638f2af0c3c27f7c54965ea"},{"branch":"fix/asr-pyav-compatibility","pr":14,"sha":"087bd845f4a6dcb5edc39238d50973d332dac90d"},{"branch":"fix/final-publication-artifact-hygiene","pr":19,"sha":"bfb0b2b538c9694fe4ee5064a94547ceb1365d48"},{"branch":"fix/pages-concurrency-recovery","pr":22,"sha":"23ede2d6df777eb0f186fbc6c43a05baa7468078"},{"branch":"fix/release-master-audio-qa","pr":12,"sha":"4045cd36f945f47e84cbf4cd87809e12df041626"},{"branch":"fix/remove-public-downloads","pr":3,"sha":"b85f90d7892fdf90199be0ddc8448bcb64bbe2f7"},{"branch":"fix/speech-interruption-lifecycle","pr":5,"sha":"9ac12f2047c2018384f75339a34724c4e2a580b4"},{"branch":"hardening/audio-model-reproducibility-disclosure","pr":15,"sha":"459ef9c38e470a4cf3fe23c853cdc548b633a784"},{"branch":"hardening/public-audio-byte-verification","pr":16,"sha":"61cc10798f143c8e9fcf9d513a6a9249beec5796"},{"branch":"improve/narration-mastering-and-review","pr":11,"sha":"5af39c73cc157e32112eb73ed3e7ca9929c6f543"},{"branch":"qa/narration-discrepancy-priorities","pr":17,"sha":"8273adacfbdd8a1b5173108ba0a8295c766129dc"},{"branch":"qa/real-browser-reader-regression","pr":21,"sha":"a0a7d769b3032547a930cd15fd92a42c53f26d89"},{"branch":"qa/review-filter-full-asr-coverage","pr":24,"sha":"9254da0167c56802c01f04139099bb745f4ff031"},{"branch":"qa/verify-private-audio-review-handoff","pr":23,"sha":"8b9b56dcb49c1a8af86fdfc30216509e2d2c9f91"},{"branch":"quality/independent-narration-asr","pr":13,"sha":"d311fed60505448d1198a3048b64c7ac4dbbad82"},{"branch":"release/recording-review-gate","pr":7,"sha":"17161823b4b388fb7c204632d201c1716ee85ef5"},{"branch":"release/verified-human-narration-staging","pr":18,"sha":"1d12cdb9e0f458dd1422408ed5b229782c7645db"},{"branch":"release/verified-public-site","pr":6,"sha":"cb89e3701174202f3c36a86e86eb78ad3a896d4d"}];
            // A full preflight prevents accidental deletion of current work.
            for (const item of expected) {
              const [branch, pr] = await Promise.all([
                github.rest.git.getRef({ owner, repo, ref: 'heads/' + item.branch }),
                github.rest.pulls.get({ owner, repo, pull_number: item.pr }),
              ]);
              const data = pr.data;
              if (branch.data.object.sha !== item.sha ||
                  data.head.sha !== item.sha ||
                  data.head.ref !== item.branch ||
                  data.base.ref !== 'main' ||
                  !data.merged_at ||
                  data.state !== 'closed') {
                throw new Error('Branch changed or PR unmerged: ' + item.branch);
              }
            }
            // Leave main, all PR records, and any unlisted branches untouched.
            for (const item of expected) {
              await github.rest.git.deleteRef({
                owner, repo, ref: 'heads/' + item.branch,
              });
              core.info('Deleted merged branch ' + item.branch + ' (PR #' + item.pr + ')');
            }
            core.notice('Removed ' + expected.length + ' verified merged branches.');
