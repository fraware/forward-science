name: Audition four neural narrator voices (private, unreviewed)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-weight narration runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check kokoro-onnx==0.6.1 soundfile numpy
          python -m pip install -r requirements-build.txt
      - name: Download and verify pinned free neural model
        run: |
          mkdir -p "$RUNNER_TEMP/kokoro"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.generate_all_audio_candidates import verify_model_assets
          base = Path(os.environ["RUNNER_TEMP"]) / "kokoro"
          verify_model_assets(base / "kokoro-v1.0.onnx", base / "voices-v1.0.bin")
          print("Model and voice pack match the prior audited release fingerprints.")
          PY
      - name: Synthesize equal-text editorial auditions
        run: |
          mkdir -p voice-auditions
          for voice in af_heart bf_emma am_michael bm_george; do
            python scripts/generate_narration_candidate.py \
              --root . \
              --model "$RUNNER_TEMP/kokoro/kokoro-v1.0.onnx" \
              --voices "$RUNNER_TEMP/kokoro/voices-v1.0.bin" \
              --voice "$voice" \
              --output "voice-auditions/$voice"
          done
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          items = []
          base = Path("voice-auditions")
          for voice in ("af_heart", "bf_emma", "am_michael", "bm_george"):
              path = base / voice
              metadata = json.loads((path / "CANDIDATE-NOT-FOR-PUBLICATION.json").read_text())
              mp3 = path / "UNREVIEWED-forward-science-preview.mp3"
              assert metadata["voice"] == voice
              assert metadata["mp3_sha256"] == hashlib.sha256(mp3.read_bytes()).hexdigest()
              assert not metadata["publication_approved"]
              quality = metadata["signal_quality"]
              assert -20 <= quality["integrated_lufs"] <= -16
              assert quality["true_peak_dbtp"] <= -1
              items.append((voice, metadata))
          assert len({data["sample_text_sha256"] for _, data in items}) == 1
          assert len({data["source_narration_sha256"] for _, data in items}) == 1
          lines = [
              "# Forward Science — unreviewed neural narrator auditions",
              "",
              "Four free Kokoro neural voices read the identical first two paragraphs of the Forward Science essay.",
              "These files are audition samples, not reviewed or published audio editions.",
              "Original source paragraphs and the verified model are identical across samples.",
              "All clips are independently mastered and checked near -18 LUFS.",
              "An offline blinded player is included, with scored review export and a separate identity key.",
              "",
          ]
          for voice, info in items:
              lines.append(f"- {voice}: {info['duration_seconds']} seconds; "
                           f"sample checksum {info['mp3_sha256']}")
          lines += [
              "",
              "Listen on headphones. Compare naturalness, punctuation and cadence, paragraph joins,",
              "technical pronunciation, robotic artefacts, fatigue over a longer sample, and overall voice fit.",
              "Do not mistake loudness or a pleasant short excerpt for full-essay reliability.",
              "No sample has passed full-length listening or accuracy review.",
          ]
          (base / "README-AUDITIONS.md").write_text("\n".join(lines) + "\n")
          print("Identical manuscript fingerprints confirmed for four independent voices")
          PY
      - name: Assemble offline blind listening review with checked audio
        run: |
          python scripts/build_blind_voice_review.py \
            --input voice-auditions --output voice-auditions/blind-review
          test "$(find voice-auditions/blind-review -maxdepth 1 -name 'Voice_*.mp3' | wc -l)" -eq 4
          test -f voice-auditions/blind-review/LISTEN-OFFLINE.html
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path("voice-auditions/blind-review")
          report = json.loads((out / "PROVENANCE.json").read_text())
          assert not report["publication_approved"]
          assert set(report["audio_sha256"]) == set("ABCD")
          print("Four anonymized, source-identical and level-matched auditions packaged")
          PY
      - name: Upload read-only voice samples
        uses: actions/upload-artifact@v4
        with:
          name: FOUR-VOICE-UNREVIEWED-NARRATION-AUDITIONS
          path: |
            voice-auditions/*/UNREVIEWED-forward-science-preview.mp3
            voice-auditions/*/CANDIDATE-NOT-FOR-PUBLICATION.json
            voice-auditions/README-AUDITIONS.md
            voice-auditions/blind-review/*.mp3
            voice-auditions/blind-review/*.html
            voice-auditions/blind-review/*.json
            voice-auditions/blind-review/READ-ME-FIRST.txt
          retention-days: 30
          if-no-files-found: error
