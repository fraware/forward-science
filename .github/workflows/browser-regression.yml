name: Browser regression — Forward Science
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Playwright 1.56 does not provide Chromium for ubuntu26.04.
    # Pin a supported runner image instead of relying on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies and Chromium
        run: |
          python -m pip install -r requirements-build.txt pytest playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify rendered navigation, responsiveness and listening controls
        run: python -m pytest -q browser/verify_reader.py
