name: Validate Forward Science
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt pytest
      - name: Ensure FFmpeg media validators
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - run: node --check reader.js
      - run: python -m pytest -q -rs
      - name: Inventory original essay citations and verify link safety
        run: python scripts/audit_references.py
      - run: python scripts/build.py --strict --base-url https://fraware.github.io/forward-science
      - run: test ! -e site/downloads && ! -d site/media && ! grep -R -E 'Read offline|Listen \\(preview\\)|Pick up where you left off|Clear reading history|downloads/forward-science[.](pdf|epub|md)' site --include='*.html'
