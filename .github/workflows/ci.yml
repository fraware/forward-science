name: Validate Forward Science
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt pytest
      - run: node --check reader.js
      - run: python -m pytest -q
      - run: python scripts/build.py --strict --base-url https://fraware.github.io/forward-science
      - run: test -f site/downloads/forward-science.pdf && test -f site/downloads/forward-science.epub && test -f site/downloads/forward-science.md
