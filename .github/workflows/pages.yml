name: Publish Forward Science
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Compile the site, refusing incomplete source editions
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          if [ -z "$SITE_BASE_URL" ]; then
            echo 'Set GitHub Actions repository variable SITE_BASE_URL to the HTTPS site root.' >&2
            exit 1
          fi
          python scripts/build.py --strict --base-url "$SITE_BASE_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
