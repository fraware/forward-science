name: Publish Forward Science
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# The latest main commit must win: a stalled older deployment otherwise
# blocks newer production builds indefinitely in GitHub's concurrency queue.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt pytest
      - name: Ensure FFmpeg media validators
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Retrieve source-verified optional narrations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p narration-preview preview-archive
          gh release download forward-science-audio-previews-2026-11-07 \
            --pattern 'Forward-Science-Michael-1.10x-previews.zip' \
            --dir preview-archive
          python -m zipfile -e \
            preview-archive/Forward-Science-Michael-1.10x-previews.zip \
            narration-preview
          test -s narration-preview/UNREVIEWED-MANIFEST.json
      - name: Validate and compile the complete publication
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://fraware.github.io/forward-science' }}
        run: |
          node --check reader.js
          python -m pytest -q -rs
          python scripts/build.py --strict --base-url "$SITE_BASE_URL" --preview-dir narration-preview
          test "$(find site/media -maxdepth 1 -name 'preview-*.mp3' -type f | wc -l)" -eq 6
          grep -q 'Listen to this essay' site/forward-science/index.html
          grep -q 'data-essay-audio' site/forward-science/index.html
          ! grep -Eiq 'listen \(preview\)|pick up where you left off|clear reading history|read the essay' site/index.html
          ! grep -Eiq 'AI preview|AI narration by Michael|resume-reading' site/forward-science/index.html
          test -f site/sitemap.xml
          test -f site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Compare public Pages release with deployed artifact
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://fraware.github.io/forward-science' }}
        run: python scripts/check_publication.py --site site --base-url "$SITE_BASE_URL" --attempts 8 --delay 12
